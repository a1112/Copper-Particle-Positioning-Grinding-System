id: process
label: 工艺参数


motion:
  label: 运动参数
  rapidSpeed:
    label: 空跑速度
    default: 0.0
  stepDistance:
    label: 步动距离
    default: 0.0
  workpieceSurfaceHeight:
    label: 工件表面高度
    default: 0.0
  jogSpeed:
    label: 点动速度
    default: 0.0


spindle:
  label: 主轴

  rpm:
    label: 主轴转速
    default: 0.0

  tool_diameter:
    label: 刀具直径
    default: 0.0
  lineSpacing:
    label: 行刀间距
    default: 0.0
  cuttingDepth:
    label: 吃刀深度
    default: 0.0
  feedRate:
    label: 进给速度
    default: 0.0

